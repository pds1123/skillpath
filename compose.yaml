services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skillpath
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillpath-dev-password}
    ports:
      - "${SKILLPATH_DB_PORT:-5432}:5432"
    volumes:
      - skillpath-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpath -d skillpath"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-e2e:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: skillpath_e2e
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: skillpath-test-password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpath -d skillpath_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15

  skillpath:
    build:
      context: .
    image: skillpath:local
    ports:
      - "${SKILLPATH_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SkillPath: Host=postgres;Port=5432;Database=skillpath;Username=skillpath;Password=${POSTGRES_PASSWORD:-skillpath-dev-password}
      Admin__BootstrapEmail: ${ADMIN_BOOTSTRAP_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skillpath-postgres-data:
